# Philotes Local Development Environment
# Usage: docker compose -f deployments/docker/docker-compose.yml up -d

services:
  # PostgreSQL - Buffer database and source for testing
  postgres:
    image: postgres:16-alpine
    container_name: philotes-postgres
    environment:
      POSTGRES_USER: philotes
      POSTGRES_PASSWORD: philotes
      POSTGRES_DB: philotes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philotes -d philotes"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"

  # PostgreSQL - Source database for CDC testing
  # Pre-loaded with e-commerce sample data (customers, products, orders, order_items)
  postgres-source:
    image: postgres:16-alpine
    container_name: philotes-postgres-source
    environment:
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source
      POSTGRES_DB: source
    ports:
      - "5433:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
      - ./init-scripts-source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source -d source"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"

  # MinIO - S3-compatible object storage for Iceberg data
  minio:
    image: minio/minio:latest
    container_name: philotes-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO client - Create initial buckets
  minio-init:
    image: minio/mc:latest
    container_name: philotes-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/philotes --ignore-existing;
      mc mb local/warehouse --ignore-existing;
      mc anonymous set public local/warehouse;
      echo 'MinIO buckets initialized';
      "

  # Lakekeeper - Database migration
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest
    container_name: philotes-lakekeeper-migrate
    command: ["migrate"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "philotes-dev-encryption-key-32b"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://philotes:philotes@postgres:5432/philotes
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://philotes:philotes@postgres:5432/philotes
    depends_on:
      postgres:
        condition: service_healthy

  # Lakekeeper - Iceberg REST Catalog
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    container_name: philotes-lakekeeper
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: "philotes-dev-encryption-key-32b"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://philotes:philotes@postgres:5432/philotes
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://philotes:philotes@postgres:5432/philotes
      LAKEKEEPER__LISTEN_PORT: "8181"
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      RUST_LOG: info
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      lakekeeper-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: philotes-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: philotes-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # Trino - SQL query engine for Iceberg data lake
  trino:
    image: trinodb/trino:457
    container_name: philotes-trino
    hostname: trino
    ports:
      - "8085:8080"
    volumes:
      - ./trino:/etc/trino:ro
    environment:
      TRINO_ENVIRONMENT: development
      # S3/MinIO credentials for Iceberg catalog (matches MinIO dev defaults)
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      minio:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # HashiCorp Vault - Secrets management (dev mode for testing)
  vault:
    image: hashicorp/vault:1.15
    container_name: philotes-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vault initialization - Configure secrets for local testing
  vault-init:
    image: hashicorp/vault:1.15
    container_name: philotes-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Vault to be ready...';
      sleep 2;

      echo 'Enabling KV secrets engine...';
      vault secrets enable -path=secret kv-v2 2>/dev/null || true;

      echo 'Creating database buffer credentials...';
      vault kv put secret/philotes/database/buffer \
        password=philotes \
        username=philotes;

      echo 'Creating database source credentials...';
      vault kv put secret/philotes/database/source \
        password=source \
        username=source;

      echo 'Creating MinIO storage credentials...';
      vault kv put secret/philotes/storage/minio \
        access_key=minioadmin \
        secret_key=minioadmin;

      echo 'Vault secrets initialized successfully!';
      vault kv list secret/philotes/;
      "

  # =========================================================================
  # Dagster - Data orchestration platform
  # =========================================================================

  # Dagster PostgreSQL - Metadata database for Dagster
  dagster-postgres:
    image: postgres:16-alpine
    container_name: philotes-dagster-postgres
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dagster Webserver - UI and API
  dagster-webserver:
    image: dagster/dagster-webserver:1.9.6
    container_name: philotes-dagster-webserver
    ports:
      - "3001:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      # Philotes connection (for dagster-philotes package)
      PHILOTES_API_URL: http://philotes-api:8080
      PHILOTES_API_KEY: ""
    volumes:
      - ./dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./dagster/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - ../../dagster-philotes:/opt/dagster/app:ro
      - dagster_compute_logs:/opt/dagster/dagster_home/compute_logs
      - dagster_artifacts:/opt/dagster/dagster_home/artifacts
    working_dir: /opt/dagster/app
    command: >
      sh -c "pip install -e /opt/dagster/app && dagster-webserver -h 0.0.0.0 -p 3000"
    depends_on:
      dagster-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Dagster Daemon - Schedules, sensors, and run queue
  dagster-daemon:
    image: dagster/dagster-daemon:1.9.6
    container_name: philotes-dagster-daemon
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PHILOTES_API_URL: http://philotes-api:8080
      PHILOTES_API_KEY: ""
    volumes:
      - ./dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./dagster/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - ../../dagster-philotes:/opt/dagster/app:ro
      - dagster_compute_logs:/opt/dagster/dagster_home/compute_logs
      - dagster_artifacts:/opt/dagster/dagster_home/artifacts
    working_dir: /opt/dagster/app
    command: >
      sh -c "pip install -e /opt/dagster/app && dagster-daemon run"
    depends_on:
      dagster-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_source_data:
  minio_data:
  prometheus_data:
  grafana_data:
  vault_data:
  dagster_postgres_data:
  dagster_compute_logs:
  dagster_artifacts:

networks:
  default:
    name: philotes-network
