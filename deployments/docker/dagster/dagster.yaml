# Dagster configuration for Philotes integration
# https://docs.dagster.io/deployment/dagster-instance

# Storage configuration - use PostgreSQL for run/event storage
storage:
  postgres:
    postgres_db:
      hostname: dagster-postgres
      username: dagster
      password: dagster
      db_name: dagster
      port: 5432

# Run launcher - use default process launcher for local dev
run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# Run coordinator - use default queued run coordinator
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

# Compute log manager - store logs locally
compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/dagster_home/compute_logs

# Local artifact storage
local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/dagster_home/artifacts

# Telemetry - disable for self-hosted
telemetry:
  enabled: false
