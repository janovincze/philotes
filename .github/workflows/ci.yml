name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint (new issues only)
        if: github.event_name == 'pull_request'
        run: golangci-lint run --timeout=5m --new-from-rev=origin/${{ github.base_ref }}

      - name: Run golangci-lint (full)
        if: github.event_name == 'push'
        run: golangci-lint run --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" -o bin/philotes-api-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/philotes-api
          go build -ldflags "-s -w" -o bin/philotes-worker-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/philotes-worker
          go build -ldflags "-s -w" -o bin/philotes-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/philotes-cli

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
          retention-days: 7

  # E2E tests for the dashboard (requires full Docker environment)
  test-e2e-dashboard:
    name: E2E Dashboard Tests
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dashboard dependencies
        working-directory: web
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build API server
        run: go build -o bin/philotes-api ./cmd/philotes-api

      - name: Start Docker services
        run: docker compose -f deployments/docker/docker-compose.yml up -d

      - name: Wait for Docker services
        run: |
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'

      - name: Start Next.js dev server
        working-directory: web
        run: |
          pnpm dev --port 3001 > /tmp/nextjs.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:3001; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: web
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:3001
          API_URL: http://localhost:8080

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Aggregate job to simplify branch protection rules
  ci-success:
    name: CI Success
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully"
